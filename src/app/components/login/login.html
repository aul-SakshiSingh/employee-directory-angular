<main class="login-container">
 
  <div class="login-card">
 
    <h1>Employee Directory</h1>
 
    <p>Please sign in to continue</p>
 
    <button
      type="button"
      (click)="loginWithGoogle()"
      [disabled]="loading"
      aria-label="Login with Google">
 
      {{ loading ? 'Signing in...' : 'Continue with Google' }}
 
    </button>
 
    <p *ngIf="error" 
        class="error" 
        role="alert" 
        aria-live="assertive">
      {{ error }}
    </p>
 
  </div>
 
</main>
