<div class="login-container">
 
  <div class="login-card">
 
    <h1>Employee Directory</h1>
 
    <p>Please sign in to continue</p>
 
    <button
      type="button"
      (click)="loginWithGoogle()"
      [disabled]="loading">
 
      {{ loading ? 'Signing in...' : 'Continue with Google' }}
 
    </button>
 
    <p *ngIf="error" class="error">
      {{ error }}
    </p>
 
  </div>
 
</div>
